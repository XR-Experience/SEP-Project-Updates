name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site lives in docs/; the monthly update folders are copied in beside it.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r docs/. _site/
          for dir in [0-9][0-9][0-9][0-9]_[0-9][0-9]; do
            cp -r "$dir" _site/
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
